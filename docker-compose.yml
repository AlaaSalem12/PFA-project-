# Secrets are read from the shell or from a .env file next to this file (see .env.example).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metalhr
      POSTGRES_USER: metalhr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metalhr}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metalhr -d metalhr"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://metalhr:${POSTGRES_PASSWORD:-metalhr}@postgres:5432/metalhr?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (min 32 chars) in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET (min 32 chars) in .env}
      PORT: 8081
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200,http://localhost:5173,http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "8081:8081"
volumes:
  postgres_data:
